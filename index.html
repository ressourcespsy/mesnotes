$('#new-note-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),title=f.get('title').trim();if(!title)return;const n=initNote(title,f.get('date'),f.get('type'),f.get('template')==='consult'?'<h3>Depuis la dernière consultation</h3><p><br></p><h3>Éléments de l’entretien</h3><p><br></p><h3>Décisions et suites</h3><p><br></p>':'');if(['ink','mixed'].includes(f.get('template')))n.mode=f.get('template');if(notebook){n.docs=[];if(staff){n.site=ui.site;data.staffs.unshift(n);ui.staff=n.id}else{data.formations.unshift(n);ui.formation=n.id}ui.view=kind;ui.notebookTab='notes'}else{patient().notes.unshift(n);ui.note=n.id;ui.tab='notes';ui.stage='note';ui.view='patients'}ui.redo=[];closeModal();save();render();$('#note-body')?.focus()}}
function showDocument(id){const owner=docOwner(),d=owner?.docs.find(d=>d.id===id);if(!d)return;const bytes=Uint8Array.from(atob(d.data.split(',')[1]),c=>c.charCodeAt(0));openBlobURL=URL.createObjectURL(new Blob([bytes],{type:d.type}));const u=openBlobURL;let body;if(d.type==='application/pdf')body='<object class="docviewer" data="'+u+'" type="application/pdf"><p>Votre navigateur ne propose pas d’aperçu PDF. Utilisez « Télécharger ».</p></object>';else if(['image/png','image/jpeg','image/webp'].includes(d.type))body='<img src="'+u+'" alt="'+esc(d.name)+'" style="max-width:100%;max-height:65vh;object-fit:contain;display:block;margin:auto">';else if(d.type==='text/plain'||d.type==='text/csv')body='<pre class="text-preview">'+esc(new TextDecoder().decode(bytes))+'</pre>';else body='<div class="empty">'+ic('file')+'<strong>'+esc(d.name)+'</strong>Ce fichier '+esc(fileLabel(d))+' est conservé avec vos notes.<br>Téléchargez-le pour l’ouvrir dans votre application habituelle.</div>';modal(esc(d.name),'<div class="dialog-body">'+body+'</div>','<div class="dialog-actions"><button class="btn danger" id="delete-doc">'+ic('trash')+' Supprimer</button><a class="btn secondary" href="'+u+'" download="'+esc(d.name)+'">'+ic('download')+' Télécharger</a></div>',true);$('#delete-doc').onclick=()=>{closeModal();confirmBox('Supprimer ce document ?','Le fichier sera retiré de ce carnet de démonstration.',()=>{owner.docs=owner.docs.filter(x=>x.id!==id);save();render()})}}
function inkImage(n){if(!n.strokes?.length)return '';const c=document.createElement('canvas');c.width=1400;c.height=784;const ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);n.strokes.forEach(s=>drawStroke(ctx,s,1.4,1.4));return '<img src="'+c.toDataURL()+'" alt="Note manuscrite">'}
function download(dataText,name,type){const u=URL.createObjectURL(new Blob([dataText],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}
function openSearch(){const d=$('#search-modal');d.innerHTML='<div class="searchbox">'+ic('search')+'<input id="global-search" placeholder="Un patient, un mot dans une note…" aria-label="Recherche globale">'+iconBtn('close','Fermer la recherche','data-action="close-search"')+'</div><div class="search-results" id="search-results"></div>';d.showModal();$('#global-search').oninput=searchResults;searchResults();$('#global-search').focus()}
function searchResults(){const q=$('#global-search').value.trim().toLocaleLowerCase('fr'),results=[];data.patients.filter(p=>!p.archived).forEach(p=>{if(!q||Number.isFinite(nameScore(q,p.name)))results.push({title:p.name,sub:siteList(p).join(' + '),pid:p.id,icon:'users'});if(q)p.notes.forEach(n=>{if((n.title+' '+plain(n.html)).toLocaleLowerCase('fr').includes(q))results.push({title:n.title,sub:p.name+' · '+siteList(p).join(' + ')+' · '+dateFR(n.date),pid:p.id,nid:n.id,icon:'file'})})});if(q)data.staffs.forEach(n=>{if((n.title+' '+n.staffType+' '+staffText(n)).toLocaleLowerCase('fr').includes(q))results.push({title:n.title,sub:'Staff · '+n.site+' · '+dateFR(n.date),staff:n.id,icon:'staff'})});
if(q)data.formations.forEach(n=>{if((n.title+' '+plain(n.html)+' '+n.docs.map(d=>d.name).join(' ')).toLocaleLowerCase('fr').includes(q))results.push({title:n.title,sub:'Formation · '+dateFR(n.date),formation:n.id,icon:'formation'})});
$('#search-results').innerHTML=results.length?results.slice(0,40).map(r=>'<button class="search-result" '+(r.formation?'data-search-formation="'+r.formation+'"':r.staff?'data-search-staff="'+r.staff+'"':'data-search-patient="'+r.pid+'" data-search-note="'+(r.nid||'')+'"')+'><span class="avatar">'+ic(r.icon)+'</span><span><strong>'+esc(r.title)+'</strong><small>'+esc(r.sub)+'</small></span></button>').join(''):'<div class="empty">Aucun résultat dans les deux espaces.</div>'}

function patientTabs(p){return '<nav class="patient-tabs" aria-label="Rubriques du patient">'+[['timeline','Synthèse','list',null],['notes','Saisie','file',p.notes.length],['docs','Documents','upload',p.docs.length],['staff','Staff','staff',new Set(staffEntries(p.id).map(e=>e.staff.id)).size],['tasks','À faire','task',patientTasks(p.id).filter(t=>!t.done).length],['contacts','Contact','link',null]].map(([v,label,icon,count])=>'<button type="button" data-tab="'+v+'" class="'+(ui.tab===v?'active':'')+'" aria-current="'+(ui.tab===v?'page':'false')+'">'+ic(icon)+'<span>'+label+'</span>'+(count?'<small>'+count+'</small>':'')+'</button>').join('')+'</nav>'}
function patientPages(p){const notes=[...p.notes].sort((a,b)=>b.date.localeCompare(a.date));return '<div class="notes-head"><span class="eyebrow grow">Saisie</span><span class="small">'+notes.length+'</span></div>'+(notes.length?notes.map(n=>'<button class="note-row '+(n.id===ui.note?'active':'')+'" data-note="'+n.id+'"><div class="row">'+ic('file')+' '+dateFR(n.date)+'</div><strong>'+esc(n.title||'Sans titre')+'</strong></button>').join(''):'<div class="empty small">Aucune saisie pour le moment.</div>')}
function patientPanel(p){return patientHeader(p)+patientTabs(p)+patientPages(p)}
function renderWorkspace(){let p=patient();if(!p||!hasSite(p,ui.site)||p.archived){ui.patient=sitePatients()[0]?.id;p=patient()}if(p&&!p.notes.find(n=>n.id===ui.note))ui.note=p.notes[0]?.id;
 $('#content').innerHTML='<div class="mobile-steps">'+[['patients','Patients'],['pages','Saisie'],['note',ui.tab==='notes'?'Note':'Dossier']].map(([key,label])=>'<button data-stage="'+key+'" class="'+(ui.stage===key?'active':'')+'">'+label+'</button>').join('')+'<span>'+esc(p?.name||ui.site)+'</span></div><div class="workspace patient-workspace" data-stage="'+ui.stage+'" data-patient-tab="'+ui.tab+'"><section class="patients-panel"><div class="panel-head"><div class="row"><h2 class="grow">Mes patients <span class="small">'+sitePatients().length+'</span></h2>'+iconBtn('plus','Nouveau patient','data-action="new-patient"')+'</div><div class="searchbox">'+ic('search')+'<input id="patient-search" placeholder="Trouver un patient…" aria-label="Trouver un patient" value="'+esc(ui.query)+'"></div><div class="filter-row"><button data-filter="all" class="'+(ui.filter==='all'?'active':'')+'">Tous</button><button data-filter="fav" class="'+(ui.filter==='fav'?'active':'')+'">Favoris</button></div></div><div class="patients-list">'+patientRows()+'</div></section>'+columnHandle('patients')+'<div class="patient-area">'+(p?patientHeader(p)+patientTabs(p):'')+'<div class="patient-body '+(ui.tab==='notes'?'with-pages':'')+'"><section class="pages-panel">'+(p?patientPages(p):'')+'</section>'+columnHandle('saisie')+'<section class="editor-panel" id="editor-panel"></section></div></div></div>';
 if(p)renderEditor();else $('#editor-panel').innerHTML='<div class="empty"><strong>Votre premier dossier</strong><button class="btn" data-action="new-patient">Créer un patient</button></div>';$('#patient-search').oninput=e=>{ui.query=e.target.value;$('.patients-list').innerHTML=patientRows()};$('.patient-tabs .active')?.scrollIntoView({block:'nearest',inline:'nearest'});bindResizableColumns();
}
function patientTimeline(p){const events=[];const add=(kind,id,date,title,extra={})=>events.push({key:kind+':'+id,kind,id,date:/^\d{4}-\d{2}-\d{2}$/.test(date||'')?date:'',title,...extra});
 p.notes.forEach(n=>add('notes',n.id,n.date,n.title||'Sans titre',{stamp:n.createdAt||0}));
 p.docs.forEach(d=>add('docs',d.id,stampDay(d.importedAt)||d.date,d.name,{stamp:d.importedAt||0}));
 const seen=new Set();staffEntries(p.id).forEach(({staff,section})=>{if(seen.has(staff.id))return;seen.add(staff.id);add('staff',staff.id,staff.date,staff.staffType||staff.title||'Staff',{site:staff.site,sectionId:section.id,stamp:staff.createdAt||0})});
 patientTasks(p.id).forEach(t=>add('tasks',t.id,stampDay(t.createdAt),t.title,{done:t.done,stamp:t.createdAt||0}));
 if(p.contacts?.trim()&&p.contactsUpdatedAt)add('contacts',p.id,stampDay(p.contactsUpdatedAt),'Contact mis à jour',{stamp:p.contactsUpdatedAt});
 return events.sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.stamp-a.stamp||a.key.localeCompare(b.key));
}
const TIMELINE_KINDS={notes:['Saisie','file'],docs:['Document','file'],staff:['Staff','staff'],tasks:['Tâche','task'],contacts:['Contact','link']};
function timelineHTML(p){const all=patientTimeline(p),visible=all.filter(e=>ui.timelineFilter==='all'||e.kind===ui.timelineFilter);let month=null;return '<section class="patient-timeline"><div class="timeline-toolbar"><h2>'+ic('list')+' Synthèse</h2><span>Plus récent en premier</span><select id="timeline-filter" aria-label="Filtrer la synthèse">'+[['all','Tout'],['notes','Saisie'],['docs','Documents'],['staff','Staffs'],['tasks','Tâches'],['contacts','Contacts']].map(([v,l])=>'<option value="'+v+'" '+(ui.timelineFilter===v?'selected':'')+'>'+l+'</option>').join('')+'</select></div><div class="timeline-list">'+(visible.length?visible.map(e=>{const key=e.date.slice(0,7),newMonth=key!==month;month=key;const heading=newMonth?'<h3 class="timeline-month">'+(e.date?new Date(e.date+'T12:00:00').toLocaleDateString('fr-FR',{month:'long',year:'numeric'}):'Date non renseignée')+'</h3>':'';const [label,icon]=TIMELINE_KINDS[e.kind];return heading+'<button class="timeline-row timeline-'+e.kind+'" data-timeline-key="'+esc(e.key)+'" title="Ouvrir : '+esc(e.title)+'"><time'+(e.date?' datetime="'+e.date+'"':'')+'>'+(e.date?dateFR(e.date):'—')+'</time><span class="timeline-type">'+ic(icon)+'<span>'+label+'</span></span><strong>'+esc(e.title)+'</strong>'+(e.site?'<span class="timeline-site">'+esc(e.site)+'</span>':'')+(e.kind==='tasks'?'<span class="timeline-task-state '+(e.done?'done':'')+'">'+(e.done?'Faite':'À faire')+'</span>':'')+ic('chevron')+'</button>'}).join(''):'<div class="empty small">'+(all.length?'Aucun élément de ce type.':'Les pages, documents, staffs et tâches apparaîtront ici au fil de la saisie.')+'</div>')+'</div></section>'}
function renderPatientTimeline(){const p=patient();$('#editor-panel').innerHTML=timelineHTML(p);$('#timeline-filter').onchange=e=>{ui.timelineFilter=e.target.value;renderPatientTimeline()}}
function openTimelineEntry(key){const p=patient(),e=p&&patientTimeline(p).find(item=>item.key===key);if(!e)return;finishStroke();ui.stage='note';if(e.kind==='notes'){ui.tab='notes';ui.note=e.id;ui.redo=[];render()}else if(e.kind==='docs'){ui.tab='docs';render();showDocument(e.id)}else if(e.kind==='staff'){ui.tab='staff';ui.staffEntry=e.sectionId;render();$('#history-'+e.sectionId)?.scrollIntoView({block:'nearest'})}else if(e.kind==='tasks'){ui.tab='tasks';render();newTask(e.id)}else{ui.tab='contacts';render()}}
function fullscreenActive(){return !!(document.fullscreenElement||document.webkitFullscreenElement)}
function syncFullscreenButton(){const b=$('[data-action="fullscreen"]');if(!b)return;const active=fullscreenActive(),label=active?'Quitter le plein écran':'Plein écran';b.innerHTML=ic(active?'fullscreenExit':'expand')+'<span>'+label+'</span>';b.setAttribute('aria-label',label);b.setAttribute('aria-pressed',String(active));b.title=label;b.classList.toggle('active',active)}
let fullscreenPending=false;
async function toggleFullscreen(){if(fullscreenPending)return;const root=document.documentElement,active=fullscreenActive(),action=active?(document.exitFullscreen||document.webkitExitFullscreen):(root.requestFullscreen||root.webkitRequestFullscreen);if(!action){toast('Le plein écran n’est pas disponible dans ce navigateur.');return}finishStroke();fullscreenPending=true;try{await action.call(active?document:root,...(active||!root.requestFullscreen?[]:[{navigationUI:'hide'}]))}catch{toast('Le navigateur n’a pas autorisé le plein écran. Ouvrez le fichier dans un onglet puis réessayez.')}finally{fullscreenPending=false;syncFullscreenButton()}}
ICONS.fullscreenExit='<path d="M8 3v5H3m13-5v5h5M3 16h5v5m13-5h-5v5"/>';
document.addEventListener('fullscreenchange',syncFullscreenButton);document.addEventListener('webkitfullscreenchange',syncFullscreenButton);
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.timelineKey)openTimelineEntry(b.dataset.timelineKey);if(b.dataset.action==='fullscreen')toggleFullscreen()});

ICONS.resizeGrip='<path d="M5 9h14M5 15h14"/>';
ICONS.minus='<path d="M5 12h14"/>';
function editorSizeTools(){return '<div class="editor-size-tools" aria-label="Taille de la zone de saisie"><button type="button" class="size-auto" data-editor-size="auto" title="Revenir à la hauteur automatique" aria-label="Hauteur automatique">Auto</button><div class="editor-height-handle" data-editor-resize role="separator" tabindex="0" aria-orientation="horizontal" aria-label="Hauteur de la zone de saisie" title="Glisser pour agrandir ou réduire · double-clic : hauteur automatique">'+ic('resizeGrip')+'</div><button type="button" class="iconbtn" data-editor-size="smaller" title="Réduire la zone de saisie" aria-label="Réduire la zone de saisie">'+ic('minus')+'</button><button type="button" class="iconbtn" data-editor-size="larger" title="Agrandir la zone de saisie" aria-label="Agrandir la zone de saisie">'+ic('plus')+'</button></div>'}
function boundedEditorHeight(value){return Math.round(Math.max(64,Math.min(1400,Number(value)||64)))}
function setEditorHeight(el,record,height,persist=true){const fixed=height!==null;record.editorHeight=fixed?boundedEditorHeight(height):null;el.style.height=fixed?record.editorHeight+'px':'';el.style.overflowY=fixed?'auto':'';if(persist)save()}
function bindEditorSize(el,record,scope=el?.parentElement){if(!el||!record||!scope)return;const handle=scope.querySelector('[data-editor-resize]');if(!handle)return;el.classList.add('editor-resizable');let drag=null;const update=()=>{const height=Math.round(el.getBoundingClientRect().height);handle.setAttribute('aria-valuemin','64');handle.setAttribute('aria-valuemax','1400');handle.setAttribute('aria-valuenow',String(height));handle.setAttribute('aria-valuetext',height+' pixels');scope.querySelector('[data-editor-size="auto"]')?.classList.toggle('active',!record.editorHeight)};
 if(Number.isFinite(record.editorHeight)&&record.editorHeight>0)setEditorHeight(el,record,record.editorHeight,false);update();
 const apply=(height,persist=true)=>{setEditorHeight(el,record,height,persist);update()};
 handle.onpointerdown=e=>{if(e.button!==0||e.isPrimary===false)return;e.preventDefault();finishStroke();drag={pointerId:e.pointerId,y:e.clientY,height:el.getBoundingClientRect().height};handle.setPointerCapture(e.pointerId);handle.classList.add('dragging')};
 handle.onpointermove=e=>{if(!drag||e.pointerId!==drag.pointerId)return;e.preventDefault();apply(drag.height+e.clientY-drag.y,false)};
 const finish=e=>{if(!drag||e.pointerId!==drag.pointerId)return;drag=null;handle.classList.remove('dragging');save()};handle.onpointerup=handle.onpointercancel=handle.onlostpointercapture=finish;
 handle.ondblclick=e=>{e.preventDefault();apply(null)};handle.onkeydown=e=>{if(['ArrowUp','ArrowDown','Home'].includes(e.key)){e.preventDefault();apply(e.key==='Home'?null:el.getBoundingClientRect().height+(e.key==='ArrowDown'?1:-1)*(e.shiftKey?120:40))}};
 scope.querySelectorAll('[data-editor-size]').forEach(b=>{b.onpointerdown=e=>e.preventDefault();b.onclick=()=>{apply(b.dataset.editorSize==='auto'?null:el.getBoundingClientRect().height+(b.dataset.editorSize==='larger'?96:-96))}});
}
function columnHandle(key){return '<div class="column-resizer column-'+key+'" data-resize-column="'+key+'" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Largeur de la liste '+(key==='patients'?'des patients':'des saisies')+'" title="Glisser pour ajuster la largeur · double-clic : largeur initiale"><span></span></div>'}
function columnBounds(key,total){const minimum=key==='patients'?140:130;return [minimum,Math.max(minimum,Math.floor(Math.min(key==='patients'?300:320,total*(key==='patients'?.32:.42),total-(key==='patients'?430:260))))]}
function setColumnWidth(host,key,width,persist=true){data.layoutWidths=data.layoutWidths||{};const prop='--'+key+'-column-width';if(width===null){delete data.layoutWidths[key];host.style.removeProperty(prop)}else{const [min,max]=columnBounds(key,host.getBoundingClientRect().width);const value=Math.round(Math.max(min,Math.min(max,width)));data.layoutWidths[key]=value;host.style.setProperty(prop,value+'px')}if(persist)save()}
function bindResizableColumns(){document.querySelectorAll('[data-resize-column]').forEach(handle=>{const key=handle.dataset.resizeColumn,host=handle.parentElement,panel=host.querySelector(key==='patients'?'.patients-panel':'.pages-panel');if(!panel)return;const prop='--'+key+'-column-width';let drag=null;if(Number.isFinite(data.layoutWidths?.[key]))host.style.setProperty(prop,data.layoutWidths[key]+'px');const update=()=>{const [min,max]=columnBounds(key,host.getBoundingClientRect().width);handle.setAttribute('aria-valuemin',String(min));handle.setAttribute('aria-valuemax',String(max));handle.setAttribute('aria-valuenow',String(Math.round(panel.getBoundingClientRect().width)))};update();
 const apply=(width,persist=true)=>{setColumnWidth(host,key,width,persist);update()};handle.onpointerdown=e=>{if(e.button!==0||e.isPrimary===false)return;e.preventDefault();finishStroke();drag={pointerId:e.pointerId,x:e.clientX,width:panel.getBoundingClientRect().width};handle.setPointerCapture(e.pointerId);handle.classList.add('dragging')};handle.onpointermove=e=>{if(!drag||e.pointerId!==drag.pointerId)return;e.preventDefault();apply(drag.width+e.clientX-drag.x,false)};const finish=e=>{if(!drag||e.pointerId!==drag.pointerId)return;drag=null;handle.classList.remove('dragging');save()};handle.onpointerup=handle.onpointercancel=handle.onlostpointercapture=finish;handle.ondblclick=e=>{e.preventDefault();apply(null)};handle.onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home'].includes(e.key)){e.preventDefault();apply(e.key==='Home'?null:panel.getBoundingClientRect().width+(e.key==='ArrowRight'?1:-1)*(e.shiftKey?48:16))}};
 })}
function quickTask(){finishStroke();if(ui.view==='staff'&&ui.notebookTab==='notes'){const staff=staffRecord(),section=staff?.sections.find(s=>s.id===ui.staffSection);if(section?.kind==='patient'){sectionTask(staff.id,section.id);return}}newTask()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b?.dataset.action==='quick-task')quickTask()});

(async()=>{try{db=await openDB();data=await dbGet()}catch{}if(!data||data.schema!==1){data=seed();addExampleDoc();if(db)await dbPut(data).catch(()=>{})}normalizeData();ui.note=data.patients[0]?.notes[0]?.id;try{if(sessionStorage.getItem('notespsy-demo-open')){$('#login').hidden=true;$('#app').hidden=false;render()}else login()}catch{login()}})();
